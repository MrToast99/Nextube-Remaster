name: Build Nextube Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.3
    outputs:
      fw_version:    ${{ steps.version.outputs.fw_version }}
      fs_version:    ${{ steps.version.outputs.fs_version }}
      build_version: ${{ steps.version.outputs.build_version }}
      update_type:   ${{ steps.updatetype.outputs.update_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # full history needed for git describe / diff

      - name: Extract versions
        id: version
        run: |
          FW_VER=$(python3 -c "import json; print(json.load(open('version.json'))['firmware_version'])")
          SP_VER=$(python3 -c "import json; print(json.load(open('version.json'))['fs_version'])")
          # build_version = whichever of firmware / LittleFS is higher (mirrors the
          # semverCmp logic in index.html so the release tag always matches the
          # version the update-check compares against).
          BUILD_VER=$(python3 -c "import json; d=json.load(open('version.json')); fw=tuple(int(x) for x in d['firmware_version'].split('.')); fs=tuple(int(x) for x in d['fs_version'].split('.')); print(d['firmware_version'] if fw>=fs else d['fs_version'])")
          echo "fw_version=$FW_VER"       >> $GITHUB_OUTPUT
          echo "fs_version=$SP_VER"       >> $GITHUB_OUTPUT
          echo "build_version=$BUILD_VER" >> $GITHUB_OUTPUT
          echo "Firmware: $FW_VER   LittleFS: $SP_VER   Build: $BUILD_VER"

      - name: Determine update type
        id: updatetype
        run: |
          # Compare against the most recent previous tag to decide which
          # partitions changed.  Falls back to "full" when no prior tag exists.
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found – marking as full flash"
            echo "update_type=full" >> $GITHUB_OUTPUT
          else
            echo "Comparing against $PREV_TAG"
            FW_CHANGED=$(git diff --name-only "$PREV_TAG" HEAD \
              -- main/ components/ CMakeLists.txt sdkconfig.defaults \
                 partitions.csv version.json \
              | grep -v '^data/' | wc -l | tr -d ' ')
            SP_CHANGED=$(git diff --name-only "$PREV_TAG" HEAD -- data/ \
              | wc -l | tr -d ' ')
            echo "Firmware-side changes: $FW_CHANGED   LittleFS-side changes: $SP_CHANGED"
            if [ "$FW_CHANGED" -gt 0 ] && [ "$SP_CHANGED" -gt 0 ]; then
              TYPE="full"
            elif [ "$FW_CHANGED" -gt 0 ]; then
              TYPE="firmware-ota"
            elif [ "$SP_CHANGED" -gt 0 ]; then
              TYPE="spiffs-only"
            else
              TYPE="no-change"
            fi
            echo "update_type=$TYPE" >> $GITHUB_OUTPUT
            echo "Update type: $TYPE"
          fi

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
          echo "Build complete"

      - name: Prepare artifacts
        run: |
          FW_VER=${{ steps.version.outputs.fw_version }}
          SP_VER=${{ steps.version.outputs.fs_version }}
          TYPE=${{ steps.updatetype.outputs.update_type }}
          mkdir -p artifacts

          # OTA firmware binary (use firmware version in name)
          cp build/nextube-fw.bin           artifacts/nextube-fw-v${FW_VER}-ota.bin
          cp build/bootloader/bootloader.bin artifacts/
          cp build/partition_table/partition-table.bin artifacts/

          # LittleFS binary (use LittleFS version in name)
          cp build/littlefs.bin             artifacts/nextube-littlefs-v${SP_VER}.bin

          # Create combined flashable image (USB full-flash only, NOT for OTA)
          . $IDF_PATH/export.sh
          esptool.py --chip esp32 merge_bin \
            -o artifacts/nextube-fw-v${FW_VER}-full.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 16MB \
            0x1000   build/bootloader/bootloader.bin \
            0x8000   build/partition_table/partition-table.bin \
            0x10000  build/nextube-fw.bin \
            0x910000 build/littlefs.bin

          # Record the detected update type so the release notes can reference it
          echo "$TYPE" > artifacts/update_type.txt
          BUILD_VER=${{ steps.version.outputs.build_version }}
          echo "Build v${BUILD_VER} (Firmware v${FW_VER} / LittleFS v${SP_VER}) / Update type: ${TYPE}" \
            > artifacts/build_info.txt

      - name: Generate Web UI ZIP
        run: |
          SP_VER=${{ steps.version.outputs.fs_version }}
          export BUILD_VER=${{ steps.version.outputs.build_version }}

          # Always stamp the current LittleFS version into web/version.txt so the
          # firmware's version-mismatch banner clears after the patch is applied.
          printf '%s' "$SP_VER" > data/web/version.txt

          # Script lives in .github/scripts/ to avoid embedding Python inside the
          # YAML run block (heredoc content at column 0 breaks YAML block scalars).
          python3 .github/scripts/make_Webui_patch.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextube-firmware
          path: artifacts/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextube-firmware
          path: artifacts/

      - name: Build release notes
        id: relnotes
        run: |
          FW_VER=${{ needs.build.outputs.fw_version }}
          SP_VER=${{ needs.build.outputs.fs_version }}
          BUILD_VER=${{ needs.build.outputs.build_version }}
          TYPE=${{ needs.build.outputs.update_type }}

          # Human-readable update guidance
          case "$TYPE" in
            firmware-ota)
              GUIDANCE="**Firmware changed:** flash \`nextube-fw-v${FW_VER}-ota.bin\` via **System → Firmware Update**."
              ;;
            spiffs-only)
              GUIDANCE="**Web UI changed:** upload \`nextube-WebUI-v${BUILD_VER}.zip\` via **System → Web UI Update** (config-safe, no reboot). If a full filesystem reflash is required it will be noted explicitly — use \`nextube-littlefs-v${SP_VER}.bin\` via **System → LittleFS Recovery** (⚠️ erases filesystem — back up your config first via **System → Backup & Restore**)."
              ;;
            full)
              GUIDANCE="**Both partitions changed.** Flash \`nextube-fw-v${FW_VER}-ota.bin\` via **System → Firmware Update**, then upload \`nextube-WebUI-v${BUILD_VER}.zip\` via **System → Web UI Update**. Alternatively use \`nextube-fw-v${FW_VER}-full.bin\` for a clean USB re-flash."
              ;;
            *)
              GUIDANCE="Refer to the included binaries."
              ;;
          esac

          cat > release_notes.md <<EOF
          ## Nextube-Remaster v${BUILD_VER}

          | | Version |
          |---|---|
          | **Firmware** | v${FW_VER} |
          | **LittleFS / Web UI** | v${SP_VER} |

          ### ${GUIDANCE}

          ### Files
          | File | Purpose |
          |---|---|
          | \`nextube-fw-v${FW_VER}-ota.bin\` | Firmware OTA — **System → Firmware Update** |
          | \`nextube-WebUI-v${BUILD_VER}.zip\` | Web UI update — **System → Web UI Update** (config-safe, no reboot) |
          | \`nextube-littlefs-v${SP_VER}.bin\` | LittleFS recovery — **System → LittleFS Recovery** ⚠️ erases filesystem |
          | \`nextube-fw-v${BUILD_VER}-full.bin\` | USB full flash (ESPConnect / esptool, offset 0x0) |
          | \`bootloader.bin\` | Bootloader (USB flash only) |
          | \`partition-table.bin\` | Partition table (USB flash only) |

          > **Before using LittleFS Recovery or USB full flash:** download your config via **System → Backup & Restore** and re-import it after flashing to preserve your WiFi, theme, and display preferences.
          EOF

          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Zip artifacts
        run: |
          BUILD_VER=${{ needs.build.outputs.build_version }}
          cd artifacts
          zip "../Nextube-Remaster v${BUILD_VER}.zip" ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Nextube-Remaster v${{ needs.build.outputs.build_version }}
          body_path: release_notes.md
          files: |
            Nextube-Remaster v${{ needs.build.outputs.build_version }}.zip
          draft: false
          prerelease: false
